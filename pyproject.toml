[project]
name = "cybershield-forense"
version = "0.1.0"
description = ""
authors = [
    {name = "Josue C Pinto Nt",email = "josuecpn93@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.0,<0.53.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "polars (>=1.43.1,<2.0.0)",
    "plotly (>=6.9.0,<7.0.0)",
    "matplotlib (>=3.11.1,<4.0.0)",
    "pandas (>=3.0.5,<4.0.0)"
]

[tool.poetry]
packages = [{include = "cybershield_forense", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "httpx2 (>=2.9.1,<3.0.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
